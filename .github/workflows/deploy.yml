name: Deploy The Slate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unpack the app into page.html + assets/ (see tools/bundle.py), so the
      # server hands browsers ordinary cacheable files instead of a bundle
      # they have to decode on every visit. Neither output is committed.
      - name: Build The Slate
        run: python3 tools/bundle.py check && python3 tools/bundle.py build

      # The shared sign-in used by every tool under /filmmaking/. It lives
      # beside slate/, not inside it, so one copy serves them all. Deployed
      # first: the tool below depends on it being there.
      - name: Deploy shared accounts via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.creativemedia.church
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./auth/
          server-dir: ./auth/
          exclude: |
            **/.git*
            **/.git*/**
            config.php

      - name: Deploy The Slate via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.creativemedia.church
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./slate/
          exclude: |
            **/.git*
            **/.git*/**
            **/saved/**
            auth/**
            src/**
            tools/**
            server/**
            README.md
            DEPLOY.md
