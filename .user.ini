; The Slate — PHP limits for the team library endpoints.
;
; Storyboards inline their reference images as base64 JPEG data URLs, so a
; 30-shot board is routinely several megabytes and the stock 8M post_max_size
; is not enough. When a body exceeds post_max_size PHP discards it before the
; script runs, so the request looks like an empty success — save.php reports
; the effective ceiling to the client, which refuses oversized saves up front.
;
; .user.ini is read by the CGI/FastCGI SAPIs (lsphp on LiteSpeed). Changes can
; take up to user_ini.cache_ttl (300s by default) to take effect.

post_max_size = 64M
upload_max_filesize = 64M
memory_limit = 256M
max_execution_time = 120
